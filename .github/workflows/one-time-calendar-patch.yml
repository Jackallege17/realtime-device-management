name: One-time calendar patch
on:
  push:
    branches: [sports-calendar]
    paths:
      - '.github/workflows/one-time-calendar-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sports-calendar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python patch_ohio_state.py
      - name: Commit corrected calendar and clean up
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git rm patch_ohio_state.py .github/workflows/one-time-calendar-patch.yml
          git add sports-calendar.ics
          git commit -m "Correct Michigan at Ohio State kickoff time"
          git push origin sports-calendar
