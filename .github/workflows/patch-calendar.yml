name: Patch sports calendar
on:
  push:
    paths:
      - '.github/workflows/patch-calendar.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sports-calendar
      - name: Apply confirmed calendar corrections
        shell: python
        run: |
          from pathlib import Path
          p = Path('sports-calendar.ics')
          s = p.read_text(encoding='utf-8')

          # Confirmed Tottenham festive fixture changes. Keep the original UID
          # when a fixture date changes so subscribed calendars update in place.
          changes = {
              'spurs-2026-12-30-brighton-hove-albion@jackallege17-sports': ('20261230T200000Z', '20261230T221500Z', '20261229T193000Z', '20261229T214500Z'),
              'spurs-2027-01-02-manchester-city@jackallege17-sports': ('20270102T150000Z', '20270102T171500Z', '20270103T163000Z', '20270103T184500Z'),
              'spurs-2027-01-06-fulham@jackallege17-sports': ('20270106T200000Z', '20270106T221500Z', '20270106T193000Z', '20270106T214500Z'),
          }
          for uid, (old_start, old_end, new_start, new_end) in changes.items():
              marker = f'UID:{uid}'
              if marker not in s:
                  raise RuntimeError(f'Missing event: {uid}')
              start = s.index(marker)
              end = s.index('END:VEVENT', start)
              block = s[start:end]
              block2 = block.replace(f'DTSTART:{old_start}', f'DTSTART:{new_start}').replace(f'DTEND:{old_end}', f'DTEND:{new_end}')
              if block2 == block and f'DTSTART:{new_start}' not in block:
                  raise RuntimeError(f'Unexpected current time for {uid}')
              s = s[:start] + block2 + s[end:]

          # Formula1.com confirms the 2026 Bahrain Grand Prix in Malaysia at
          # Sepang on Oct 2–4, with the Race on Oct 4 at 07:00 UTC. Ensure the
          # Race exists; never add practice, sprint, or qualifying sessions.
          uid = 'f1-2026-bahrain-in-malaysia-race@jackallege17-sports'
          marker = f'UID:{uid}'
          if marker not in s:
              event = '''BEGIN:VEVENT
UID:f1-2026-bahrain-in-malaysia-race@jackallege17-sports
DTSTAMP:20260912T185845Z
SUMMARY:🏎️ F1 — Bahrain GP in Malaysia (Sepang) — Race
DTSTART:20261004T070000Z
DTEND:20261004T093000Z
BEGIN:VALARM
ACTION:DISPLAY
DESCRIPTION:🏎️ F1 — Bahrain GP in Malaysia (Sepang) — Race — 5 days before
TRIGGER:-P5D
END:VALARM
BEGIN:VALARM
ACTION:DISPLAY
DESCRIPTION:🏎️ F1 — Bahrain GP in Malaysia (Sepang) — Race — 1 day before
TRIGGER:-P1D
END:VALARM
BEGIN:VALARM
ACTION:DISPLAY
DESCRIPTION:🏎️ F1 — Bahrain GP in Malaysia (Sepang) — Race — 2 hours before
TRIGGER:-PT2H
END:VALARM
END:VEVENT
'''
              anchor = 'BEGIN:VEVENT\nUID:umd-2026-10-10-ohio-state@jackallege17-sports'
              if anchor not in s:
                  raise RuntimeError('Missing insertion anchor after Sepang race date')
              s = s.replace(anchor, event + anchor, 1)

          p.write_text(s, encoding='utf-8', newline='')
      - name: Commit if changed
        run: |
          git config user.name 'sports-calendar-bot'
          git config user.email 'sports-calendar-bot@users.noreply.github.com'
          git add sports-calendar.ics
          git diff --cached --quiet || git commit -m 'Maintain sports calendar'
          git push origin sports-calendar
# Maintenance trigger: preserve history and current official F1 reconciliation
