name: Update sports calendar

on:
  push:
    branches: [sports-calendar]
    paths:
      - calendar_builder.py
      - .github/workflows/update-sports-calendar.yml
  workflow_dispatch:

permissions:
  contents: write

# Regenerate the subscribed ICS whenever the authoritative builder changes.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sports-calendar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate calendar
        run: python calendar_builder.py
      - name: Commit changed calendar
        run: |
          if git diff --quiet -- sports-calendar.ics; then
            echo "No calendar changes"
            exit 0
          fi
          git config user.name "sports-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sports-calendar.ics
          git commit -m "Update sports calendar"
          git push origin HEAD:sports-calendar
