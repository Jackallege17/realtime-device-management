name: Rebuild sports calendar

on:
  push:
    branches: [sports-calendar]
    paths:
      - calendar_builder_v2.py

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sports-calendar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python calendar_builder_v2.py
      - name: Commit calendar if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sports-calendar.ics
          git diff --cached --quiet && exit 0
          git commit -m 'Restore official Bahrain GP in Malaysia race'
          git push origin sports-calendar
